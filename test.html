<!doctype html>
<!-- StickMan: self-contained animation demo. Save as an .html file and open in a browser.

Edit the animation script near the bottom to connect the demonstration to your application. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A small switch takes a superhero-sized effort. Try this funny animated toggle with StickMan, then download the HTML, CSS, and JavaScript for your own site."><title>Stubborn Toggle — Animated Toggle Switch | StickMan</title><style>
:root{color-scheme:dark;--bg:#18181c;--panel:#1c1c21;--text:#eeeeef;--muted:#a2a2ad;--line:#34343c;--accent:#c5b9ff;font-family:Arial,Helvetica,sans-serif;font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit}
button,a{touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
button{cursor:pointer}
svg{display:block}
button:disabled{cursor:wait}
.wrap{max-width:1200px;margin:auto;padding:0 52px}
.site-header{height:104px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:600;font-size:18px;letter-spacing:-.5px}
.brand svg{width:25px;height:25px}
.nav{display:flex;gap:30px;font-size:13px;color:var(--muted)}
.nav a:hover,.text-link:hover{color:var(--text)}
.nav .nav-active{color:var(--text)}
.hero{padding:76px 0 57px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
h1{font-size:clamp(48px,6.3vw,80px);font-weight:500;letter-spacing:-.04em;line-height:1.04;margin:0;max-width:770px;text-wrap:balance}
h1 em{font-style:normal;color:var(--muted)}
.hero-note{max-width:220px;color:var(--muted);font-size:14px;line-height:1.75;margin:0 0 6px}
.section-line{display:flex;justify-content:space-between;align-items:center;padding:0 0 20px;font-size:12px;color:var(--muted)}
.section-line p{margin:0}
.status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.featured{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.preview{position:relative;background:#1b1b20;height:410px}
.preview iframe{border:0;width:100%;height:100%;display:block}
.preview-corner{position:absolute;left:25px;top:22px;color:#8e8e99;font-size:11px;pointer-events:none}
.preview-hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.feature-info{border-top:1px solid var(--line);padding:27px 30px;display:flex;justify-content:space-between;gap:24px;align-items:center}
.feature-info h2{font-size:21px;font-weight:500;letter-spacing:-.5px;margin:0 0 8px}
.feature-info p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.open-link{display:inline-flex;align-items:center;gap:15px;white-space:nowrap;font-size:13px;border-bottom:1px solid #696973;padding-bottom:6px}
.open-link svg{width:15px;height:15px;transition:transform .2s}
.open-link:hover svg{transform:translate(2px,-2px)}
.workbench{padding:54px 0 64px}
.workbench h2{font-size:14px;font-weight:400;margin:0;color:var(--muted)}
.upcoming{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:20px}
.idea{display:flex;gap:21px;align-items:center;padding:25px 0;border-top:1px solid var(--line)}
.idea-icon{width:62px;height:48px;display:grid;place-items:center;flex-shrink:0;color:#9e9ea9}
.idea-icon svg{width:48px;height:38px}
.idea h3{font-size:16px;font-weight:400;margin:0 0 8px}
.idea p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.idea .tag{display:block;color:#94949f;font-size:10px;margin-top:10px}
.about{padding:62px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:48px}
.about h2{font-size:35px;letter-spacing:-1px;font-weight:400;line-height:1.15;margin:0}
.about p{color:var(--muted);font-size:14px;line-height:1.8;max-width:460px;margin:0}
.footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:26px 0 35px;font-size:12px;color:var(--muted)}
.footer a:hover{color:var(--text)}
.demo-page{min-height:100svh;display:flex;flex-direction:column}
.demo-header{padding:29px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.back-link{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
.back-link svg{width:15px;height:15px}
.demo-header .brand{font-size:15px}
.demo-main{width:100%;max-width:1000px;margin:auto;padding:30px 32px 60px}
.demo-title{text-align:center}
.demo-title h1{font-size:32px;letter-spacing:-1px;max-width:none}
.demo-title p{font-size:13px;color:var(--muted);line-height:1.8;margin:13px 0 0}
.demo-stage-wrap{position:relative;max-width:760px;margin:0 auto}
.scene{position:relative;width:100%;aspect-ratio:640/380;isolation:isolate;overflow:hidden}
.scene-art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;color:#eeeef3}
.download-button{position:absolute;left:34.375%;top:73.684%;width:31.25%;height:12.632%;padding:0;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #51515b;background:#27272e;border-radius:7px;color:#eeeeef;font-size:clamp(11px,2.1vw,14px);font-weight:500;z-index:2;transform-origin:center bottom;overflow:hidden}
.download-button:hover:not(:disabled){background:#303037;border-color:#777783}
.download-button:disabled{color:#eeeeef;opacity:1}
.download-button svg{width:16px;height:16px;flex:none}
.button-content{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;z-index:1}
.progress-fill{position:absolute;inset:0;background:#3e3a50;transform:scaleX(0);transform-origin:left;opacity:0}
.download-button.is-running .progress-fill{opacity:1}
.download-button.is-done{border-color:#787087}
.download-button.is-done .button-content{color:#e0d8ff}
.scene-caption{text-align:center;min-height:22px;font-size:12px;color:var(--muted);margin:0}
.demo-toolbar{margin:35px auto 0;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.quiet-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);border:1px solid var(--line);background:transparent;border-radius:6px;padding:9px 12px;font-size:11px;min-height:36px}
.quiet-button svg{height:14px;width:14px}
.quiet-button:hover{color:var(--text);border-color:#676771}
.quiet-button[aria-pressed=true]{color:var(--text);background:#25252c}
.quiet-button:disabled{opacity:.4}
.demo-footnote{text-align:center;font-size:11px;line-height:1.8;color:var(--muted);margin:25px auto 0;max-width:420px}
.demo-footer{padding:25px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:20px}
.demo-footer a:hover{color:var(--text)}
.embed .demo-header,.embed .demo-title,.embed .demo-toolbar,.embed .demo-footnote,.embed .demo-footer,.embed .scene-caption{display:none}
.embed{min-height:0;background:#1b1b20;height:100svh;display:grid;place-items:center}
.embed .demo-main{padding:0;width:min(600px,100%);margin:0;transform:translateY(-22px)}
.embed .download-button{font-size:13px}
.presentation .demo-header,.presentation .demo-title,.presentation .demo-footer,.presentation .demo-footnote,.presentation .scene-caption{visibility:hidden}
.presentation .demo-toolbar .quiet-button:not([data-presentation]){display:none}
.presentation .demo-toolbar{position:fixed;right:24px;bottom:20px;opacity:.3}
.presentation .demo-toolbar:hover{opacity:1}
.presentation .demo-main{max-width:1000px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:1400px){.hero{padding-top:92px}
}
@media(max-width:700px){.wrap{padding:0 24px}
.site-header{height:80px}
.brand{font-size:16px}
.nav{gap:18px;font-size:12px}
.hero{display:block;padding:48px 0 38px}
.hero h1{font-size:54px}
.hero-note{max-width:290px;margin-top:25px;font-size:13px}
.preview{height:310px}
.preview-corner{left:18px;top:18px}
.feature-info{padding:22px;align-items:flex-start;flex-direction:column;gap:20px}
.feature-info h2{font-size:19px}
.upcoming{grid-template-columns:1fr;gap:0}
.workbench{padding:35px 0}
.about{grid-template-columns:1fr;gap:23px;padding:40px 0}
.about h2{font-size:30px}
.footer{font-size:11px}
.demo-header{padding:24px 20px}
.demo-main{padding:28px 12px 50px}
.demo-title h1{font-size:28px}
.demo-title p{max-width:260px;margin:12px auto 0}
.demo-stage-wrap{margin-top:35px}
.demo-toolbar{margin-top:28px}
.demo-footer{padding:22px 20px;font-size:10px}
.embed .demo-stage-wrap{margin:0}
.embed .demo-main{transform:translateY(-2px)}
.embed .download-button{font-size:11px}
.scene-caption{font-size:11px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
*,*::before,*::after{transition:none!important}
}


.save-link{display:block;text-align:center;font-size:11px;color:var(--accent);margin-top:12px;text-decoration:underline;text-underline-offset:3px}
.save-link[hidden],.embed .save-link,.presentation .save-link{display:none}
.download-button.is-running .button-content{gap:0}
.download-button{overflow:visible}
.progress-fill{border-radius:6px}
.download-button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
.is-embed body{background:#1b1b20}

.presentation .demo-toolbar{opacity:1}
.presentation .demo-toolbar:focus-within{opacity:1}

.embed{--scene-bg:#1b1b20}

.code-export{max-width:700px;margin:48px auto 0;border-top:1px solid var(--line);padding:28px 0 0}
.code-export h2{font-size:18px;font-weight:500;margin:0 0 10px}
.code-export p{color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 17px;max-width:580px}
.code-actions{display:flex;gap:10px;flex-wrap:wrap}
.code-export details{margin-top:18px;color:var(--muted);font-size:12px}
.code-export summary{cursor:pointer;padding:6px 0;width:fit-content}
.code-export textarea{display:block;width:100%;height:250px;margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:6px;background:#121216;color:#d7d7e0;font:11px/1.6 ui-monospace,monospace;resize:vertical;white-space:pre;tab-size:2}
.code-export .code-status{min-height:21px;margin:12px 0 0}
.embed .code-export,.presentation .code-export{display:none}
.feature-links{display:flex;gap:18px;align-items:center;flex-shrink:0}
.feature-links .code-link{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:5px}
.code-link:hover{color:var(--text)}
@media(max-width:700px){.code-export{margin:36px 12px 0}.feature-links{gap:15px}}

 'delete-duty':[[.15,'paper'],[.8,'crumb'],[1.1,'crumb'],[1.72,'sweep'],[2.7,'step'],[2.92,'sweep'],[3.9,'step'],[4.12,'sweep'],[5.2,'pan'],[5.15,'step'],[6.15,'scuff'],[6.7,'pan']],
 'impatient-refresh':[[1.2,'spin'],[1.9,'spin'],[2.45,'spin'],[2.9,'spin'],[3.25,'spin'],[3.5,'spin'],[3.75,'spin'],[3.95,'air'],[4.55,'land']],
 'stage-fright':[[.35,'scurry'],[1.1,'curtain'],[2.35,'scuff'],[3.15,'curtain'],[4.65,'curtain']],
 'ceiling-file':[[.3,'step'],[1.24,'cast'],[2.2,'metal'],[2.35,'rope'],[3.38,'cast'],[3.95,'metal'],[4.25,'rope'],[4.8,'rope'],[5.35,'rope'],[5.85,'release'],[5.92,'air'],[6.28,'heavy']]
};
function announce(state){if(embedded)parent.postMessage({type:'experiment-state',state},location.origin);}
function setBusy(value){busy=value;for(const el of [trigger,replay])el.setAttribute('aria-disabled',String(value));trigger.setAttribute('aria-busy',String(value));}
function saveFile(){if(!shouldDownload||delivered)return;delivered=true;const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(['STICKMAN DELIVERY NOTICE', '', 'File retrieved. The first throw was just a warm-up.', '', 'This is a sample from StickMan: funny little UI interactions with reusable code.', 'Try the other missions: https://stick-man-ui.vercel.app/', '', 'Made by Ahmed Shamim', 'X / Twitter: https://x.com/me_shaon', 'LinkedIn: https://www.linkedin.com/in/ahmed-shamim/', '', 'P.S. If this rescue made you smile, share StickMan with a friend.'].join('\n')+'\n');a.download='stickman-delivery.txt';document.body.append(a);a.click();a.remove();}
function finish(cancelled=false){setBusy(false);set(ground,'opacity',0);set(worker,'opacity',0);front.innerHTML='';debris.innerHTML='';
 if(mode==='stubborn-toggle'){on=!on;toggle(-1);trigger.setAttribute('aria-checked',String(on));label.textContent=on?'Notifications on':'Notifications off';}
 if(mode==='delete-duty'){props.innerHTML='';trigger.style.opacity='1';label.textContent='Restore note';trigger.setAttribute('aria-label','Restore note');document.body.classList.add('note-deleted');const row=$('[data-note-row]');row.style.opacity='1';row.style.transform='';$('[data-note-title]').textContent='All tidy.';$('[data-note-meta]').textContent='Restore to try again.';}
 if(mode==='impatient-refresh')refresh(-1);
 if(mode==='stage-fright'){revealed=false;password(-1);trigger.setAttribute('aria-label','Show password');caption.textContent='Privacy restored.';}
 if(mode==='ceiling-file'){props.innerHTML='';label.textContent='Download again';trigger.setAttribute('aria-label','Download sample file again');if(!cancelled)saveFile();}
 const completed={'stubborn-toggle':on?'Notifications on. Worth it.':'Notifications off. Worth it.','delete-duty':'All tidy. Finally.','impatient-refresh':'Very refreshed.','stage-fright':'Privacy restored.','ceiling-file':'File delivered. Pride slightly damaged.'};
 caption.textContent=completed[mode];
 live.textContent='Complete. '+(mode==='stubborn-toggle'?(on?'Notifications on.':'Notifications off.'):mode==='delete-duty'?'Note deleted.':mode==='impatient-refresh'?'Refreshed.':'Ready to replay.');announce('done');
}
function play(download=true){if(busy)return;shouldDownload=mode==='ceiling-file'&&download;delivered=false;
 if(mode==='delete-duty'&&label.textContent==='Restore note'){deletion(-1);label.textContent='Delete';trigger.setAttribute('aria-label','Delete note');caption.textContent='Restored. Ready for another cleanup.';live.textContent='Note restored.';return;}
 if(mode==='delete-duty')deletion(-1);
 setBusy(true);live.textContent='Animation playing.';announce('running');initAudio();previous=-1;
 if(reduce.matches){finish();return;}
 const start=performance.now();function tick(now){const t=(now-start)/1000;renderers[mode](t);if(mode==='ceiling-file'&&t>=6.3)saveFile();for(const [at,name] of sounds[mode])if(at>previous&&at<=t&&t-at<.15&&audible)foley.play(name);previous=t;if(t<durations[mode])raf=requestAnimationFrame(tick);else finish();}raf=requestAnimationFrame(tick);
}
function updateSound(){sound.setAttribute('aria-pressed',String(audible));sound.querySelector('span').textContent=audible?'Sound on':'Sound off';}
trigger.addEventListener('click',()=>play(true));replay.addEventListener('click',()=>{if(busy)return;if(mode==='delete-duty'){label.textContent='Delete';trigger.setAttribute('aria-label','Delete note');}play(false);});
sound.addEventListener('click',()=>{audible=!audible;updateSound();if(audible)initAudio();else foley.stop();});updateSound();
const clean=$('[data-presentation]');function presentation(active){document.body.classList.toggle('presentation',active);clean.setAttribute('aria-pressed',String(active));clean.querySelector('span').textContent=active?'Exit clean view':'Clean view';}
clean.addEventListener('click',()=>presentation(!document.body.classList.contains('presentation')));document.addEventListener('keydown',e=>{if(e.key==='Escape')presentation(false);});
window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);if(busy)finish(true);foley.close();});
renderers[mode](-1);caption.textContent='Go on. Give it a try.';


})();
</script>
